# Local development services. Not used in production.
#
# No password is stored in the repo: the database trusts connections, and the port is bound to
# 127.0.0.1 so only this machine can reach it. Never use this configuration on a shared host.
services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbis
      POSTGRES_DB: orbis
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - orbis-pg:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbis -d orbis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orbis-pg:
