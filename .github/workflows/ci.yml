name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: orbis
          POSTGRES_DB: orbis
          # Ephemeral container reachable only from this job, so no password is needed or stored.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbis -d orbis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway values for CI only. No real credentials are used, and every external
    # integration is left unconfigured so its safe fallback is exercised.
    env:
      APP_ENV: test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgres://orbis@localhost:5432/orbis
      TEST_DATABASE_URL: postgres://orbis@localhost:5432/orbis_test
      E2E_DATABASE_URL: postgres://orbis@localhost:5432/orbis_e2e
      STORAGE_DRIVER: local
      LOG_LEVEL: warn
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Generate throwaway secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "SEED_DEMO_PASSWORD=$(openssl rand -base64 18)" >> "$GITHUB_ENV"

      - name: Create test database
        run: psql "postgres://orbis@localhost:5432/orbis" -c "CREATE DATABASE orbis_test OWNER orbis;"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Apply migrations to a clean database
        run: pnpm db:migrate

      # Fictional seed data so the build prerenders real catalogue pages.
      - name: Seed demo data
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Runs against the production build above; the E2E database is reset and seeded first.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
